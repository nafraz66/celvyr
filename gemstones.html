<head>
<meta charset="utf-8">

<body data-page="gemstones">
<div id="site-header"></div>
<main>

<div class="wrap">
  <div class="crumbs"><a href="index.html">Home</a><i>/</i>Gemstones</div>
  <div class="coll-head center">
    <div class="eyebrow">The gemstone collection</div>
    <h1 class="h-xl">Find your colour.</h1>
    <p class="lead">From deep ocean blues to the softest blush pinks.<br>Every stone here is the only one of its kind.</p>
    <div class="chips">
      <button class="chip on" data-type="All">All gemstones</button>
      <button class="chip" data-type="Sapphire">Sapphires</button>
      <button class="chip" data-type="Spinel">Spinels</button>
      <button class="chip" data-type="Tourmaline">Tourmalines</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="filters">
      <label>Colour<select id="fShade"></select></label>
      <label>Shape<select id="fCut"><option value="">All</option><option>Oval</option><option>Round</option></select></label>
      <label>Price<select id="fPrice"><option value="">Any</option><option value="lo">Under LKR 250,000</option><option value="mid">LKR 250,000 – 400,000</option><option value="hi">Over LKR 400,000</option></select></label>
    </div>
    <div><span id="count"></span> &nbsp;|&nbsp; Sort: <select id="fSort"><option value="featured">Featured</option><option value="lo">Price, low to high</option><option value="hi">Price, high to low</option><option value="ct">Carat, largest first</option></select></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="band" style="margin:72px 0 84px">
    <div><h3 class="serif">A specific stone in mind?</h3><p class="lead">Let your colour, cut and budget guide the search. We'll do the legwork.</p></div>
    <a class="btn btn-line" href="contact.html">Ask Celvyr</a>
  </div>
</div>

</main>
<div id="site-footer"></div>
<script src="assets/catalogue.js"></script>
<script src="assets/app.js"></script>
